<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Scholarships</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside class="sidebar"><div class="logo">🎓 <span>ScholarTrack</span></div><nav><a href="dashboard.html">📊 Dashboard</a><a href="students.html">👨‍🎓 Students</a><a class="active" href="scholarships.html">🎓 Scholarships</a><a href="requirements.html">📋 Requirements</a><a href="compliance.html">📚 Academic Compliance</a><a href="reports.html">📈 Reports</a></nav><button id="logoutBtn" class="logout">↪ Logout</button></aside>
<main class="main"><header><div><h2>Scholarships</h2><p>Manage available scholarship programs.</p></div></header><section class="panel"><div class="panel-title"><h3>Scholarship Programs</h3><button class="btn primary" id="addScholarshipBtn">+ Add Scholarship</button></div><div class="table-wrap"><table><thead><tr><th>Scholarship</th><th>Provider</th><th>Amount</th><th>Deadline</th><th>Status</th></tr></thead><tbody id="scholarshipTable"></tbody></table></div></section></main></div>
<div class="modal" id="scholarshipModal"><div class="modal-box"><button class="close" id="closeScholarship">×</button><h3>Add Scholarship</h3><form id="scholarshipForm" class="form-grid"><input id="scholarshipName" placeholder="Scholarship Name" required><input id="provider" placeholder="Provider" required><input id="amount" type="number" placeholder="Amount" required><input id="deadline" type="date" required><select id="scholarshipStatus"><option>Active</option><option>Closed</option></select><button class="btn primary">Save Scholarship</button></form></div></div>
<script src="js/supabase.js"></script><script src="js/scholarships.js"></script></body></html>
